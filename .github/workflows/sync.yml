name: sync-vfs
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: vfs-mutations
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: linux-fsdevel
          repositories: vfs

      - name: Sync kernel.org to GitHub
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git init --bare /tmp/vfs-sync && cd /tmp/vfs-sync
          git remote add origin \
            https://git.kernel.org/pub/scm/linux/kernel/git/vfs/vfs.git
          git fetch origin vfs.all:refs/heads/vfs.all vfs.fixes:refs/heads/vfs.fixes
          git remote set-url --push origin \
            https://github.com/linux-fsdevel/vfs.git
          git -c http.extraheader="Authorization: basic $(echo -n x-access-token:${GITHUB_TOKEN} | base64 -w0)" \
            push --force origin vfs.all vfs.fixes
